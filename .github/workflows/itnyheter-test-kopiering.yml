name: IT-Nyheter - testa Markdown-kopiering

on:
  push:
    branches: [main]
    paths:
      - "Test/Nyheter/index.html"
      - ".github/workflows/itnyheter-test-kopiering.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-markdown-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera JavaScript och Markdown-kopiering
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const assert = require("node:assert/strict");

          const html = fs.readFileSync("Test/Nyheter/index.html", "utf8");
          const inline = html.match(/<script[^>]*>([\s\S]*?)<\/script>/i)?.[1];
          assert.ok(inline, "Kunde inte hitta appens JavaScript.");
          new vm.Script(inline, {filename: "Test/Nyheter/index.html"});

          const start = inline.indexOf("  function formatCopyMarkdown(");
          const end = inline.indexOf("  function attachArticleResize(", start);
          assert.ok(start >= 0 && end > start, "Kopieringsfunktionerna hittades inte.");
          const scope = {
            displayTitle: item => item.titel,
            displayType: item => item.typ
          };
          vm.runInNewContext(inline.slice(start, end), scope);
          const {formatCopyMarkdown, markdownForLegacyFacts, copyNewsText} = scope;
          const md = formatCopyMarkdown(
            "N: Rubrik",
            "ID: 82 · Dokumenttyp: IT-Nyhet",
            ["AI", "Matematik"],
            "https://example.org/article",
            "En kort ingress.",
            "## Mellanrubrik\n\n**Fetstil** och [länk](https://example.org/kalla).\n\n- Punkt 1\n- Punkt 2"
          );
          assert.ok(md.startsWith("# N: Rubrik\n"), "Huvudrubriken saknas.");
          assert.ok(md.includes("- ID: 82\n- Dokumenttyp: IT-Nyhet"), "Metadata saknas.");
          assert.ok(md.includes("Kategorier: AI, Matematik"), "Kategorier saknas.");
          assert.ok(md.includes("<https://example.org/article>"), "Källänken saknas.");
          assert.ok(md.includes("## Ingress\n\n**En kort ingress.**"), "Ingressens formatering saknas.");
          assert.ok(md.includes("## Mellanrubrik\n\n**Fetstil**"), "Mellanrubrik/fetstil har förlorats.");
          assert.ok(md.includes("[länk](https://example.org/kalla)"), "Markdownlänken saknas.");
          assert.ok(md.includes("- Punkt 1\n- Punkt 2"), "Listan har förlorats.");
          assert.ok(!inline.includes("function plainArticleText("), "Äldre kopieringsfunktion finns kvar.");

          const publicData = JSON.parse(fs.readFileSync("Test/Nyheter/nyheter.json", "utf8"));
          const docs = publicData.nyheter;
          const news = docs.find(x => x.id === 82);
          assert.ok(news, "Testnyheten saknas.");
          const newsCopy = copyNewsText(news, false, true, "ID: 82", "", news.original_länk);
          assert.ok(newsCopy.includes("## Vad har OpenAI publicerat?"), "Nyhetens rubriker saknas.");
          assert.ok(newsCopy.includes("**Uppdatering:**"), "Befintlig fetstil har förlorats.");

          const fact = docs.find(x => x.id === 46);
          assert.ok(fact, "Äldre IT-Fakta saknas.");
          const factCopy = copyNewsText(fact, false, true, "ID: 46", "", "");
          assert.ok(factCopy.includes("## AI generellt"), "Äldre faktarubriker konverterades inte.");
          assert.ok(factCopy.includes("## Olika datamodeller"), "Ytterligare faktarubrik saknas.");
          assert.ok(markdownForLegacyFacts("## Redan i Markdown\n\n**Text**").startsWith("## Redan i Markdown"), "Markdown som redan finns ska bevaras.");

          const video = docs.find(x => x.typ === "IT-YouTube");
          assert.ok(video, "YouTube-dokument saknas.");
          const videoCopy = copyNewsText(video, true, false, "Dokumenttyp: IT-YouTube", "Transkriberingsspråk: Svenska\nTranskriptämnen: AI", video.webbadress);
          assert.ok(videoCopy.startsWith("# Y: "), "YouTube-rubriken saknas.");
          assert.ok(videoCopy.includes("## Transkriptinformation\n\n- Transkriberingsspråk: Svenska"), "Transkriptformatering saknas.");
          assert.ok(videoCopy.includes("<https://www.youtube.com/"), "YouTube-adressen saknas.");

          assert.ok(html.includes("const originalText = formatCopyMarkdown("), "Originaltextens kopiering använder inte Markdown.");
          const startAudit = inline.indexOf("  function ownerArticleSourceData(");
          const endAudit = inline.indexOf("  function renderNews(", startAudit);
          assert.ok(startAudit >= 0 && endAudit > startAudit, "Ägarens kontrollfunktion saknas.");
          const auditScope = {
            ownerMode: true,
            ownerAuthenticated: true,
            originalNewsById: new Map(),
            displayType: item => item.typ,
            URL,
            document: {
              createElement: tag => ({
                tag, children: [], attrs: {}, textContent: "", href: "",
                append(...children) {this.children.push(...children);},
                setAttribute(name, value) {this.attrs[name] = value;}
              }),
              createTextNode: value => ({textContent: value})
            }
          };
          vm.runInNewContext(inline.slice(startAudit, endAudit), auditScope);
          const {ownerArticleSourceData, createOwnerSourceAudit} = auditScope;
          const item = {id: 500, typ: "IT-Nyhet", original_länk: "https://example.org/nyhet"};
          const textOf = node => typeof node === "string" ? node : [
            node?.textContent || "", ...(node?.children || []).map(textOf)
          ].join(" ");
          let info = ownerArticleSourceData(item);
          assert.equal(info.status, "Ej verifierad", "Äldre nyheter får inte gissad status.");
          assert.equal(info.completeSources, false, "Okänd källförteckning får inte anses fullständig.");
          assert.ok(textOf(createOwnerSourceAudit(item, true)).includes("Använda källor: Ännu inte dokumenterade."));
          assert.ok(textOf(createOwnerSourceAudit(item, false)).includes("Originalartikel: Ej verifierad"));
          auditScope.ownerMode = false;
          assert.equal(createOwnerSourceAudit(item, true), null, "Publik/VIP får inte se ägarstatus.");
          auditScope.ownerMode = true;
          auditScope.ownerAuthenticated = false;
          assert.equal(createOwnerSourceAudit(item, true), null, "Ej verifierad ägare får inte se ägarstatus.");
          auditScope.ownerAuthenticated = true;
          assert.equal(createOwnerSourceAudit({id: 501, typ: "IT-Fakta"}, true), null, "Status för originalartikel ska inte appliceras på IT-Fakta.");
          for (const status of ["Fullständig", "Ofullständig", "Misstänkt ofullständig", "Ej verifierad"]) {
            auditScope.originalNewsById.set("500", {
              fullstandighetsstatus: status,
              kalla: "Testkälla",
              url: "https://example.org/nyhet",
              anvanda_kallor: [
                {namn: "Huvudkälla", roll: "huvudkälla", url: "https://example.org/nyhet"},
                {namn: "Faktakontroll", roll: "faktakontroll", url: "https://example.org/kontroll"}
              ],
              kallredovisning_komplett: true,
              underlagskommentar: "Manuellt granskat"
            });
            info = ownerArticleSourceData(item);
            assert.equal(info.status, status);
            assert.equal(info.sources.length, 2);
            assert.equal(info.completeSources, true);
            const rendered = createOwnerSourceAudit(item, true);
            assert.ok(textOf(rendered).includes("Originalartikel: " + status));
            assert.ok(textOf(rendered).includes("Huvudkälla"));
            assert.ok(textOf(rendered).includes("Faktakontroll"));
          }
          console.log("OK: Ägarstatus, alla fyra statusvärden, källroller, verifieringsstandard och VIP-spärr.");
          // PC: Skift+Pil ska rulla båda jämförelsekolumnerna var för sig.
          const scrollStart = inline.indexOf("  function scrollDetailedArticle(");
          const scrollEnd = inline.indexOf("  function playSelectedYoutube(", scrollStart);
          assert.ok(scrollStart >= 0 && scrollEnd > scrollStart, "Skift+Pil-funktionen saknas.");
          const makeColumn = (total, visible) => ({
            scrollHeight: total, clientHeight: visible, scrollTop: 0,
            querySelector: () => ({})
          });
          const first = makeColumn(300, 150);
          const second = makeColumn(550, 150);
          const single = makeColumn(360, 160);
          const state = {compare: [first, second], single: null};
          const scrollScope = {
            listEl: {
              querySelectorAll: selector => selector === ".owner-content-compare .owner-content-column" ? state.compare : [],
              querySelector: selector => selector === ".news.article-detailed" ? state.single : null
            },
            getComputedStyle: () => ({lineHeight: "24px", fontSize: "16px"})
          };
          vm.runInNewContext(inline.slice(scrollStart, scrollEnd), scrollScope);
          const scroll = scrollScope.scrollDetailedArticle;
          assert.equal(scroll(1), true);
          assert.equal(first.scrollTop, 48, "Första kolumnen rullades inte.");
          assert.equal(second.scrollTop, 48, "Andra kolumnen rullades inte.");
          for (let i = 0; i < 3; i++) scroll(1);
          assert.equal(first.scrollTop, 150, "Kort kolumn ska stanna på slutgränsen.");
          assert.equal(second.scrollTop, 192, "Längre kolumn ska fortsätta efter kortare.");
          for (let i = 0; i < 20; i++) scroll(1);
          assert.equal(first.scrollTop, 150, "Kort kolumn får inte passera slutgränsen.");
          assert.equal(second.scrollTop, 400, "Andra kolumnen ska nå sitt eget slut.");
          scroll(-1);
          assert.equal(first.scrollTop, 102, "Första kolumnen ska rulla uppåt igen.");
          assert.equal(second.scrollTop, 352, "Andra kolumnen ska rulla uppåt igen.");
          for (let i = 0; i < 20; i++) scroll(-1);
          assert.equal(first.scrollTop, 0, "Första kolumnen får inte passera början.");
          assert.equal(second.scrollTop, 0, "Andra kolumnen får inte passera början.");
          state.compare = [];
          state.single = single;
          assert.equal(scroll(1), true, "Enskild artikel ska också kunna rullas.");
          assert.equal(single.scrollTop, 48);
          state.single = null;
          assert.equal(scroll(1), false, "Utan öppet dokument ska inget hända.");

          // Kortkommandot fungerar också när kopiera-knapp eller länk har fokus.
          const keyStart = inline.indexOf("  function keyboardShortcutAllowed(");
          const keyEnd = inline.indexOf("  function applyFilters(", keyStart);
          assert.ok(keyStart >= 0 && keyEnd > keyStart);
          class TestElement {}
          const keyScope = {Element: TestElement, exactTitleFilter: {}};
          vm.runInNewContext(inline.slice(keyStart, keyEnd), keyScope);
          const button = new TestElement();
          button.tagName = "BUTTON";
          button.isContentEditable = false;
          button.closest = selector => selector.includes(".owner-content-column") ? {} : null;
          assert.equal(keyScope.keyboardShortcutAllowed({target: button, shiftKey: true, key: "ArrowDown"}), true);
          assert.equal(keyScope.keyboardShortcutAllowed({target: button, shiftKey: false, key: "ArrowDown"}), false);
          const input = new TestElement();
          input.tagName = "INPUT";
          input.isContentEditable = false;
          assert.equal(keyScope.keyboardShortcutAllowed({target: input, shiftKey: true, key: "ArrowDown"}), false);
          console.log("OK: Skift+Pil parallellrullar kolumner, respekterar separata slut/början och fungerar i enskilt dokument.");
          console.log("OK: JavaScript-syntax, IT-Nyhet, IT-Fakta, IT-YouTube, originaltext och Markdown-format.");
          NODE
