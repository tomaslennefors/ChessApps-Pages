name: IT-Nyheter - verifiera publicerad kopieringskod

on:
  push:
    branches: [main]
    paths:
      - "Test/Nyheter/index.html"
      - ".github/workflows/itnyheter-verify-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Hämta exakt commit
        uses: actions/checkout@v4

      - name: Jämför publicerad HTML med rätt commit
        env:
          VERIFY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          source = Path("Test/Nyheter/index.html").read_bytes()
          expected_hash = hashlib.sha256(source).hexdigest()
          url = ("https://tomaslennefors.github.io/ChessApps-Pages/Test/Nyheter/index.html"
                 "?verify_commit=" + os.environ["VERIFY_SHA"])
          for attempt in range(36):
              try:
                  request = Request(url, headers={
                      "User-Agent": "ITNyheter-Pages-Verification/1.0",
                      "Cache-Control": "no-cache",
                  })
                  with urlopen(request, timeout=20) as response:
                      live = response.read(len(source) + 4096)
                  actual_hash = hashlib.sha256(live).hexdigest()
                  if source == live:
                      print("VERIFIERAT: Publicerad HTML är byte-för-byte identisk med commit", os.environ["VERIFY_SHA"])
                      print("SHA256:", expected_hash)
                      raise SystemExit(0)
                  print("Försök", attempt + 1, ": Live-SHA256", actual_hash, "förväntad", expected_hash)
              except Exception as error:
                  print("Försök", attempt + 1, ":", error)
              if attempt < 35:
                  time.sleep(10)
          raise SystemExit("Kunde inte verifiera att rätt HTML-fil publicerats inom 6 minuter.")
          PY
