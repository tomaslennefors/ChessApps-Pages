<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TestPiecesAnimation · cm-chessboard</title>
<link rel="stylesheet" href="../assets/chessboard.css">
<link rel="stylesheet" href="../assets/extensions/markers/markers.css">
<link rel="stylesheet" href="../assets/extensions/arrows/arrows.css">
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#20332e;background:#fff}
body{margin:0;padding:16px}.summary{padding:12px 14px;border-radius:7px;margin-bottom:12px}.summary.good{background:#e8f4e5;border-left:4px solid #4f8a4a}.summary.bad{background:#fff0eb;border-left:4px solid #be4c2a}
h2{font-size:16px;margin:18px 0 8px}.test{padding:8px 10px;border-bottom:1px solid #e6ebe6;font-size:13px}.pass{color:#2f6731}.fail{color:#9b321b}.fail pre{white-space:pre-wrap;font-size:11px;background:#fff5f1;padding:8px}
.test-boards{display:grid;grid-template-columns:repeat(5,minmax(120px,180px));gap:8px;margin:0 0 16px}.test-board{min-height:120px;width:100%;max-width:180px}
@media(max-width:800px){.test-boards{grid-template-columns:repeat(2,minmax(120px,1fr))}}
</style>
</head>
<body>
<div class="test-boards" aria-label="Testbräden">
  <div class="test-board" id="TestBoard"></div>
  <div class="test-board" id="TestPosition"></div>
  <div class="test-board" id="TestMarkers"></div>
  <div class="test-board" id="TestArrows"></div>
  <div class="test-board" id="TestPieceRotation"></div>
</div>
<div id="teevi-results">Startar TestPiecesAnimation…</div>
<script type="module">
import {teevi} from "../node_modules/teevi/src/teevi.js";
import "./TestPiecesAnimation.js";
await teevi.run();
</script>
</body>
</html>
